[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serpapi-job-match"
version = "0.1.0"
description = "Find remote jobs with SerpApi Google Jobs, rank them against a resume, and explain each match with Claude."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
jobmatch = "jobmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jobmatch"]
